        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    CursorParam:
      name: cursor
      in: query
      description: 游标分页位置
      schema: { type: string }
    LimitParam:
      name: limit
      in: query
      description: 每页数量
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      description: 幂等键，重复请求返回首次结果
      schema: { type: string }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 短期访问令牌，工作台来自 sessionStorage，插件来自 Native Messaging Bootstrap。
  responses:
    BadRequest:
      description: 请求参数或格式错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 未认证或令牌无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Origin 校验失败或权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 资源冲突或状态非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: 服务器内部错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: 错误码
        message:
          type: string
          description: 错误信息
        details:
          type: object
          description: 附加详情
        request_id:
          type: string
          description: 请求追踪 ID
      required: [code, message, request_id]
    HealthResponse:
      type: object
      properties:
        agent_version: { type: string }
        api_version: { type: string }
        db_schema_version: { type: string }
        platform_adapter_version: { type: string }
      required: [agent_version, api_version, db_schema_version]
    CustomerGrade:
      type: string
      enum: [A, B, C]
    CustomerStatus:
      type: string
      enum: [active, inactive]
    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        company: { type: string, nullable: true }
        country: { type: string, nullable: true }
        source: { type: string, nullable: true }
        grade: { $ref: '#/components/schemas/CustomerGrade' }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        deleted_at: { type: string, nullable: true, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, grade, status, created_at, updated_at]
    CustomerCreate:
      type: object
      properties:
        name: { type: string }
        company: { type: string }
        country: { type: string }
        source: { type: string }
        grade: { $ref: '#/components/schemas/CustomerGrade' }
        status: { $ref: '#/components/schemas/CustomerStatus' }
      required: [name, grade]
    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        company: { type: string }
        country: { type: string }
        source: { type: string }
        grade: { $ref: '#/components/schemas/CustomerGrade' }
        status: { $ref: '#/components/schemas/CustomerStatus' }
    CustomerDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/Customer'
        - type: object
          properties:
            contacts:
              type: array
              items: { $ref: '#/components/schemas/Contact' }
            social_accounts:
              type: array
              items: { $ref: '#/components/schemas/SocialAccount' }
            follow_ups:
              type: array
              items: { $ref: '#/components/schemas/FollowUp' }
            projects:
              type: array
              items: { $ref: '#/components/schemas/Project' }
            pending_reminders:
              type: array
              items: { $ref: '#/components/schemas/Reminder' }
    CustomerListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        next_cursor: { type: string, nullable: true }
      required: [items]
    CustomerMergeRequest:
      type: object
      properties:
        source_id: { type: string }
        target_id: { type: string }
        field_resolutions:
          type: object
          description: 冲突字段的手动裁决结果
      required: [source_id, target_id]
    Contact:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        name: { type: string }
        title: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, customer_id, name, created_at]
    ContactCreate:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        email: { type: string }
        phone: { type: string }
      required: [name]
    ContactUpdate:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        email: { type: string }
        phone: { type: string }
    SocialAccount:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        contact_id: { type: string, nullable: true }
        platform: { type: string }
        raw_identifier: { type: string }
        normalized_identifier: { type: string }
        manually_bound: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, customer_id, platform, raw_identifier, normalized_identifier, manually_bound, created_at]
    SocialAccountCreate:
      type: object
      properties:
        platform: { type: string }
        raw_identifier: { type: string }
        contact_id: { type: string }
      required: [platform, raw_identifier]
    Binding:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        platform: { type: string }
        raw_identifier: { type: string }
        normalized_identifier: { type: string }
        manually_bound: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, customer_id, platform, raw_identifier, normalized_identifier, manually_bound, created_at]
    MatchResolveRequest:
      type: object
      properties:
        platform: { type: string }
        raw_identifier: { type: string }
      required: [platform, raw_identifier]
    MatchResolveResponse:
      type: object
      properties:
        status:
          type: string
          enum: [unique, multiple, none]
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        customer: { $ref: '#/components/schemas/Customer' }
      required: [status]
    MatchBindRequest:
      type: object
      properties:
        platform: { type: string }
        raw_identifier: { type: string }
        customer_id: { type: string }
      required: [platform, raw_identifier, customer_id]
    MatchUnbindRequest:
      type: object
      properties:
        platform: { type: string }
        raw_identifier: { type: string }
      required: [platform, raw_identifier]
    FollowUpType:
      type: string
      enum: [call, email, chat, visit, note, message]
    MessageDirection:
      type: string
      enum: [inbound, outbound]
    FollowUp:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        project_id: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/FollowUpType' }
        note: { type: string, nullable: true }
        message_body: { type: string, nullable: true }
        message_direction: { $ref: '#/components/schemas/MessageDirection', nullable: true }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, customer_id, type, occurred_at, created_at]
    FollowUpCreate:
      type: object
      properties:
        customer_id: { type: string }
        project_id: { type: string }
        type: { $ref: '#/components/schemas/FollowUpType' }
        note: { type: string }
        message_body: { type: string }
        message_direction: { $ref: '#/components/schemas/MessageDirection' }
        occurred_at: { type: string, format: date-time }
      required: [customer_id, type, occurred_at]
    FollowUpUpdate:
      type: object
      properties:
        project_id: { type: string }
        type: { $ref: '#/components/schemas/FollowUpType' }
        note: { type: string }
        message_body: { type: string }
        message_direction: { $ref: '#/components/schemas/MessageDirection' }
        occurred_at: { type: string, format: date-time }
    FollowUpListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FollowUp' }
        next_cursor: { type: string, nullable: true }
      required: [items]
    ReminderType:
      type: string
      enum: [fixed_time, waiting_reply, paused]
    ReminderStatus:
      type: string
      enum: [pending, completed, snoozed, ignored, overdue, replied]
    ReminderPriority:
      type: string
      enum: [low, normal, high, urgent]
    Reminder:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        project_id: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/ReminderType' }
        status: { $ref: '#/components/schemas/ReminderStatus' }
        due_at: { type: string, format: date-time }
        priority: { $ref: '#/components/schemas/ReminderPriority' }
        last_notified_at: { type: string, nullable: true, format: date-time }
        snooze_until: { type: string, nullable: true, format: date-time }
        resolution: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, customer_id, type, status, due_at, priority, created_at, updated_at]
    ReminderCreate:
      type: object
      properties:
        customer_id: { type: string }
        project_id: { type: string }
        type: { $ref: '#/components/schemas/ReminderType' }
        due_at: { type: string, format: date-time }
        priority: { $ref: '#/components/schemas/ReminderPriority' }
      required: [customer_id, type, due_at]
    ReminderStatusUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/ReminderStatus' }
        snooze_until: { type: string, format: date-time }
        resolution: { type: string }
      required: [status]
    ReminderListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Reminder' }
        next_cursor: { type: string, nullable: true }
      required: [items]
    ProjectStage:
      type: string
      enum: [lead, qualified, proposal, negotiation, closed_won, closed_lost, archived]
    ProjectGrade:
      type: string
      enum: [S, A, B, C]
    Project:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        name: { type: string }
        currency: { type: string }
        amount: { type: number, nullable: true }
        probability: { type: integer, minimum: 0, maximum: 100, nullable: true }
        expected_close_date: { type: string, nullable: true, format: date }
        stage: { $ref: '#/components/schemas/ProjectStage' }
        grade: { $ref: '#/components/schemas/ProjectGrade' }
        closed_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, customer_id, name, stage, grade, created_at, updated_at]
    ProjectCreate:
      type: object
      properties:
        customer_id: { type: string }
        name: { type: string }
        currency: { type: string }
        amount: { type: number }
        probability: { type: integer }
        expected_close_date: { type: string, format: date }
        stage: { $ref: '#/components/schemas/ProjectStage' }
        grade: { $ref: '#/components/schemas/ProjectGrade' }
      required: [customer_id, name, stage, grade]
    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        currency: { type: string }
        amount: { type: number }
        probability: { type: integer }
        expected_close_date: { type: string, format: date }
        stage: { $ref: '#/components/schemas/ProjectStage' }
        grade: { $ref: '#/components/schemas/ProjectGrade' }
        closed_reason: { type: string }
    ProjectDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            risks:
              type: array
              items: { $ref: '#/components/schemas/Risk' }
            milestones:
              type: array
              items: { $ref: '#/components/schemas/Milestone' }
            pending_reminders:
              type: array
              items: { $ref: '#/components/schemas/Reminder' }
    ProjectListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        next_cursor: { type: string, nullable: true }
      required: [items]
    RiskSeverity:
      type: string
      enum: [low, medium, high, critical]
    RiskStatus:
      type: string
      enum: [open, handling, resolved, ignored]
    Risk:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/RiskSeverity' }
        status: { $ref: '#/components/schemas/RiskStatus' }
        handled_at: { type: string, nullable: true, format: date-time }
        created_at: { type: string, format: date-time }
      required: [id, project_id, description, severity, status, created_at]
    RiskCreate:
      type: object
      properties:
        description: { type: string }
        severity: { $ref: '#/components/schemas/RiskSeverity' }
      required: [description, severity]
    RiskUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/RiskStatus' }
        severity: { $ref: '#/components/schemas/RiskSeverity' }
        handled_at: { type: string, format: date-time }
    Milestone:
      type: object
      properties:
        id: { type: string }
        project_id: { type: string }
        name: { type: string }
        date: { type: string, format: date }
        completed: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, project_id, name, date, completed, created_at]
    MilestoneCreate:
      type: object
      properties:
        name: { type: string }
        date: { type: string, format: date }
      required: [name, date]
    ImportParseResponse:
      type: object
      properties:
        job_id: { type: string }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              field: { type: string }
              message: { type: string }
        duplicate_candidates:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              candidates: { type: array, items: { $ref: '#/components/schemas/Customer' } }
        preview:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
      required: [job_id, total_rows, valid_rows]
    ImportCommitRequest:
      type: object
      properties:
        job_id: { type: string }
        resolutions:
          type: array
          items:
            type: object
            properties:
              row: { type: integer }
              action:
                type: string
                enum: [merge, skip, create]
              target_id: { type: string }
          description: 重复候选的处理决策
      required: [job_id]
    ImportCommitResponse:
      type: object
      properties:
        success: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }
        duplicates: { type: integer }
      required: [success, failed, skipped, duplicates]
    ExportRequest:
      type: object
      properties:
        filters:
          type: object
          description: 与客户列表一致的筛选条件
          properties:
            search: { type: string }
            grade: { $ref: '#/components/schemas/CustomerGrade' }
            status: { type: string }
    BackupCreateRequest:
      type: object
      properties:
        password: { type: string, format: password }
      required: [password]
    BackupValidateResponse:
      type: object
      properties:
        valid: { type: boolean }
        schema_version: { type: string }
        app_version: { type: string }
        integrity_ok: { type: boolean }
      required: [valid, integrity_ok]
    BackupRestoreResponse:
      type: object
      properties:
        success: { type: boolean }
        rows_restored: { type: integer }
      required: [success, rows_restored]
    Settings:
      type: object
      properties:
        id: { type: integer, example: 1 }
        last_backup_at: { type: string, nullable: true, format: date-time }
        auto_start: { type: boolean }
        minimize_to_tray: { type: boolean }
        backup_reminder_days: { type: integer, nullable: true }
        locale: { type: string }
        theme: { type: string }
      required: [id]
    SettingsUpdate:
      type: object
      properties:
        last_backup_at: { type: string, format: date-time }
        auto_start: { type: boolean }
        minimize_to_tray: { type: boolean }
        backup_reminder_days: { type: integer }
        locale: { type: string }
        theme: { type: string }
    Stats:
      type: object
      properties:
        total_customers: { type: integer }
        total_followups: { type: integer }
        total_reminders: { type: integer }
        total_projects: { type: integer }
        pending_reminders: { type: integer }
        overdue_reminders: { type: integer }
        completion_rate: { type: number }
        last_backup_at: { type: string, nullable: true, format: date-time }
      required: [total_customers, total_followups, total_reminders, total_projects]

security:
  - BearerAuth: []
