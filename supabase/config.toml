project_id = "dealpilot"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://round123.github.io/dealpilot/"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://127.0.0.1:4174/**",
  "http://localhost:4174/**",
  "http://127.0.0.1:4188/**",
  "http://localhost:4188/**",
  "https://round123.github.io/dealpilot/**",
  "https://round123.github.io/dealpilot/auth-callback.html",
  "https://round123.github.io/dealpilot/set-password"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[analytics]
enabled = false
port = 54327
vector_port = 54328
backend = "postgres"

[functions.purge-expired-customers]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.admin-account-cleanup]
verify_jwt = true
