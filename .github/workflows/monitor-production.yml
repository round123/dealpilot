name: Monitor WebCloud production

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-webcloud-production
  cancel-in-progress: true

jobs:
  smoke:
    name: Check public production health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUD_WEB_URL: https://round123.github.io/dealpilot/
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SB_PUBLISHABLE_KEY }}
      RELEASE_SHA: ${{ github.sha }}
      CLOUD_SMOKE_FUNCTIONS: purge-expired-customers
    steps:
      - uses: actions/checkout@v4
      - name: Validate public health configuration
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
      - name: Check Web, Auth, RLS and protected Edge health
        run: node scripts/cloud-smoke.mjs
      - name: Open or retain the production health alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] DealPilot production health check failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  "The scheduled production smoke check failed.",
                  "",
                  `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `Commit: ${context.sha}`,
                  "",
                  "Keep this issue open until a later successful check closes it automatically.",
                ].join("\n"),
              });
            }
      - name: Close a recovered production health alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[monitor] DealPilot production health check failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered in workflow run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
