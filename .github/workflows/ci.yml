name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject backward-incompatible PostgreSQL migrations
        shell: bash
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          node scripts/check-migration-compatibility.mjs \
            --base "$base_sha" \
            --head "${{ github.sha }}"
      - name: Test release gates and smoke checks
        run: >-
          node --test
          apps/extension/scripts/verify-package.test.mjs
          scripts/audit-v2-production.test.mjs
          scripts/check-migration-compatibility.test.mjs
          scripts/cloud-smoke.test.mjs
          scripts/release-workflows.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Audit V2 production dependencies
        run: pnpm audit:v2
      - name: Test Edge handlers without network access
        run: >-
          node --experimental-strip-types --test
          supabase/functions/purge-expired-customers/handler.test.ts
          supabase/functions/delete-account/handler.test.ts
      - name: Type-check V2 packages
        run: >-
          pnpm exec turbo type-check
          --filter=@dealpilot/shared
          --filter=@dealpilot/api-client
          --filter=@dealpilot/cloud
          --filter=@dealpilot/extension
          --filter=@dealpilot/migration
      - name: Lint V2 packages
        run: >-
          pnpm exec turbo lint
          --filter=@dealpilot/shared
          --filter=@dealpilot/api-client
          --filter=@dealpilot/cloud
          --filter=@dealpilot/extension
          --filter=@dealpilot/migration
      - name: Install Chromium for browser tests
        run: pnpm test:e2e:install
      - name: Test V2 packages
        run: >-
          pnpm exec turbo test
          --filter=@dealpilot/shared
          --filter=@dealpilot/api-client
          --filter=@dealpilot/cloud
          --filter=@dealpilot/extension
          --filter=@dealpilot/migration
      - name: Build V2 packages
        run: >-
          pnpm exec turbo build
          --filter=@dealpilot/shared
          --filter=@dealpilot/api-client
          --filter=@dealpilot/cloud
          --filter=@dealpilot/extension
          --filter=@dealpilot/migration
      - name: Package extension with non-production public configuration
        env:
          VITE_SUPABASE_URL: https://dealpilot-ci.supabase.co
          VITE_SB_PUBLISHABLE_KEY: ci-publishable-key-not-a-secret
          VITE_DEALPILOT_WEB_URL: https://dealpilot-ci.example.com/
        run: pnpm --filter @dealpilot/extension package:chrome
      - name: Upload extension packaging smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealpilot-extension-ci-smoke-${{ github.sha }}
          path: apps/extension/.output/*-chrome.zip
          include-hidden-files: true
          retention-days: 3

  cloud-demo-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm test:e2e:install
      - name: Run Cloud demo end-to-end tests
        run: pnpm --filter @dealpilot/cloud test:e2e:demo
      - name: Verify production PWA install and offline application shell
        run: pnpm --filter @dealpilot/cloud test:e2e:pwa

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start
      - run: supabase db reset
      - name: Verify schema security invariants
        run: >-
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/schema_security.sql
      - name: Verify two-user isolation and Customer RPCs
        run: >-
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/personal_isolation.sql
      - name: Verify Customer cursor, contact merge, and Deal write contracts
        run: |
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/customer_cursor_pagination.sql
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/contact_merge.sql
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/deal_update_atomic.sql
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/deal_create_atomic.sql
      - name: Verify extension and reminder write idempotency
        run: |
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/extension_follow_up_idempotency.sql
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/reminder_status_idempotency.sql
      - name: Verify cloud import and query scale baseline
        run: >-
          psql postgres://postgres:postgres@127.0.0.1:54322/postgres
          -v ON_ERROR_STOP=1
          -f supabase/tests/cloud_scale_acceptance.sql
      - name: Export local Supabase public settings
        shell: bash
        run: |
          source <(supabase status -o env)
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SB_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "VITE_IS_DEMO=false" >> "$GITHUB_ENV"
          echo "VITE_ATTACHMENTS_BUCKET=attachments" >> "$GITHUB_ENV"
      - name: Build Cloud against local Supabase
        run: pnpm exec turbo build --filter=@dealpilot/cloud
      - name: Install Chromium
        run: pnpm test:e2e:install
      - name: Start Cloud against local Supabase
        shell: bash
        run: |
          nohup pnpm --filter @dealpilot/cloud exec vite preview \
            --host 127.0.0.1 --port 4188 \
            > /tmp/dealpilot-cloud.log 2>&1 &

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4188/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/dealpilot-cloud.log
          exit 1
      - name: Start Edge Functions with JWT verification
        shell: bash
        run: |
          nohup supabase functions serve \
            > /tmp/dealpilot-edge.log 2>&1 &

          for attempt in {1..60}; do
            purge_status="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/functions/v1/purge-expired-customers")"
            delete_status="$(curl --silent --output /dev/null \
              --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/functions/v1/delete-account")"
            if [ "$purge_status" = "403" ] && [ "$delete_status" = "401" ]; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/dealpilot-edge.log
          exit 1
      - name: Verify browser and API user isolation
        shell: bash
        run: |
          source <(supabase status -o env)
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            pnpm --filter @dealpilot/cloud test:e2e:supabase
      - name: Print local service logs after failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/dealpilot-cloud.log 2>/dev/null || true
          cat /tmp/dealpilot-edge.log 2>/dev/null || true
      - name: Upload Supabase browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-browser-failure-${{ github.sha }}
          path: apps/cloud/test-results/supabase-e2e
          if-no-files-found: ignore
          retention-days: 7
