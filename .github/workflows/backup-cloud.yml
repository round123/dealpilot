name: Backup WebCloud disaster recovery archive

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webcloud-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypt relational and attachment backup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cloud-production-ops
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.110.0
      - name: Validate fail-closed backup configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_AGE_RECIPIENT; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required configuration: $variable" >&2
              exit 1
            fi
          done
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "SUPABASE_PROJECT_REF has an invalid format." >&2
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://$SUPABASE_PROJECT_REF\.supabase\.co/?$ ]]; then
            echo "SUPABASE_URL does not match SUPABASE_PROJECT_REF." >&2
            exit 1
          fi
          if [[ ! "$BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]; then
            echo "BACKUP_AGE_RECIPIENT must be an age X25519 public recipient." >&2
            exit 1
          fi
      - name: Install age from Ubuntu repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age
      - name: Link immutable production source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"
      - name: Export relational and persistent Auth data
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          payload="$RUNNER_TEMP/dealpilot-dr-payload"
          mkdir -p "$payload/storage"
          echo "DR_PAYLOAD=$payload" >> "$GITHUB_ENV"
          supabase db dump \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --data-only \
            --use-copy \
            --schema public,auth \
            --exclude auth.audit_log_entries \
            --exclude auth.flow_state \
            --exclude auth.mfa_amr_claims \
            --exclude auth.mfa_challenges \
            --exclude auth.mfa_factors \
            --exclude auth.one_time_tokens \
            --exclude auth.refresh_tokens \
            --exclude auth.sessions \
            --file "$payload/database.sql"
          test -s "$payload/database.sql"
      - name: Download private attachment objects
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ATTACHMENTS_BUCKET: attachments
        run: node scripts/storage-disaster-recovery.mjs backup "$DR_PAYLOAD/storage"
      - name: Create and encrypt archive
        id: archive
        shell: bash
        env:
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/disaster-recovery-manifest.mjs create "$DR_PAYLOAD"
          archive="$RUNNER_TEMP/dealpilot-dr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          encrypted="$RUNNER_TEMP/dealpilot-dr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.age"
          tar --create --file "$archive" --directory "$DR_PAYLOAD" .
          age --recipient "$BACKUP_AGE_RECIPIENT" --output "$encrypted" "$archive"
          rm -f "$archive"
          rm -rf "$DR_PAYLOAD"
          test -s "$encrypted"
          echo "encrypted=$encrypted" >> "$GITHUB_OUTPUT"
          echo "artifact_name=dealpilot-dr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted archive only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.encrypted }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 35
      - name: Record non-sensitive backup evidence
        shell: bash
        run: |
          {
            echo "### Encrypted disaster-recovery backup"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Artifact: ${{ steps.archive.outputs.artifact_name }}"
            echo "- Retention request: 35 days"
            echo "- Plaintext uploaded: no"
          } >> "$GITHUB_STEP_SUMMARY"
