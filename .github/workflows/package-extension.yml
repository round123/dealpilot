name: Package Browser Extension

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching extension-v<package version>
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: read

concurrency:
  group: extension-production
  cancel-in-progress: false

jobs:
  package:
    name: Package production Chrome and Edge extension
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloud-production
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SB_PUBLISHABLE_KEY: ${{ secrets.VITE_SB_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Validate manual extension release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          expected_tag="$(node -p "'extension-v' + require('./apps/extension/package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "release_tag must exactly match $expected_tag." >&2
            exit 1
          fi
      - name: Verify manual release SHA passed CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_run_id="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_SHA&event=push&status=success&per_page=10" \
            --jq '.workflow_runs | map(select(.head_branch == "main" and .conclusion == "success")) | .[0].id // empty')"
          if [ -z "$ci_run_id" ]; then
            echo "Manual extension packaging requires successful CI for the same main SHA." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve deployed DealPilot Web URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          web_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          test -n "$web_url"
          echo "VITE_DEALPILOT_WEB_URL=$web_url" >> "$GITHUB_ENV"
      - name: Validate public extension configuration
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SB_PUBLISHABLE_KEY"
          test -n "$VITE_DEALPILOT_WEB_URL"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Verify production Supabase Auth target
        run: node scripts/verify-extension-production-config.mjs
      - run: pnpm install --frozen-lockfile
      - name: Build and verify Chrome and Edge store candidates
        run: pnpm --filter @dealpilot/extension package:stores
      - name: Upload Chrome store candidate
        uses: actions/upload-artifact@v4
        with:
          name: dealpilot-extension-chrome-${{ env.RELEASE_SHA }}
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Upload Edge store candidate
        uses: actions/upload-artifact@v4
        with:
          name: dealpilot-extension-edge-${{ env.RELEASE_SHA }}
          path: apps/extension/.output/*-edge.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Record extension package evidence
        shell: bash
        run: |
          {
            echo "### Production browser extension package"
            echo "- Release SHA: $RELEASE_SHA"
            echo "- Browsers: Chrome and Edge (Manifest V3)"
            echo "- Web: $VITE_DEALPILOT_WEB_URL"
            echo "- Chrome artifact: dealpilot-extension-chrome-$RELEASE_SHA"
            echo "- Edge artifact: dealpilot-extension-edge-$RELEASE_SHA"
            echo "- Store upload: manual approval required"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish verified extension ZIPs to GitHub Release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloud-production
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download verified Chrome package
        uses: actions/download-artifact@v4
        with:
          name: dealpilot-extension-chrome-${{ env.RELEASE_SHA }}
          path: release-input/chrome
      - name: Download verified Edge package
        uses: actions/download-artifact@v4
        with:
          name: dealpilot-extension-edge-${{ env.RELEASE_SHA }}
          path: release-input/edge
      - name: Prepare stable Release asset names
        shell: bash
        run: |
          shopt -s nullglob
          chrome_packages=(release-input/chrome/*.zip)
          edge_packages=(release-input/edge/*.zip)
          if [ "${#chrome_packages[@]}" -ne 1 ] || [ "${#edge_packages[@]}" -ne 1 ]; then
            echo "Expected exactly one verified inner ZIP for each browser." >&2
            exit 1
          fi

          mkdir release-assets
          cp "${chrome_packages[0]}" release-assets/dealpilot-extension-chrome.zip
          cp "${edge_packages[0]}" release-assets/dealpilot-extension-edge.zip
          (
            cd release-assets
            sha256sum ./*.zip | tee SHA256SUMS.txt
          )
      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Git tag $RELEASE_TAG already exists; extension releases are immutable." >&2
            exit 1
          fi

          version="${RELEASE_TAG#extension-v}"
          gh release create "$RELEASE_TAG" \
            release-assets/dealpilot-extension-chrome.zip \
            release-assets/dealpilot-extension-edge.zip \
            release-assets/SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title "DealPilot Browser Extension $version" \
            --notes "Verified Chrome and Edge Manifest V3 store candidates built from main commit $RELEASE_SHA. Store submission remains manual." \
            --latest=false
      - name: Record GitHub Release evidence
        shell: bash
        run: |
          {
            echo "### Browser extension GitHub Release"
            echo "- Tag: $RELEASE_TAG"
            echo "- Release SHA: $RELEASE_SHA"
            echo "- Chrome asset: dealpilot-extension-chrome.zip"
            echo "- Edge asset: dealpilot-extension-edge.zip"
            echo "- Store submission: manual"
          } >> "$GITHUB_STEP_SUMMARY"
